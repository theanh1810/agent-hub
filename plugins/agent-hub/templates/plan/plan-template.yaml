# plan.yaml — full template: plan-level keys, waves and every task inline
#
# Each task is written in full under tasks:, with the keys of task-template.yaml
# plus wave and depends_on. refs/plan-files.md says how the plan is read.
# English in every value here; the mirror plan.<lang>.md carries the reply language.
# The per-field table is in the planner role's Language section.
# English/ASCII for keys, ids, enum values. File paths and code verbatim.
#
# Pair file: plan.<lang>.md — same waves, same ids, same statuses.
# All plan files live under {plan_dir}/ (docs/changes/{plan_id}/) — refs/plan-files.md § Where a plan lives.
# Every docs/… path below resolves from {workspace_root}, never from a sub-repo.

test_schema: layers                # cases carry `layer`, not `type` — refs/roles/planner/test-cases.md § Layers; a plan without this key keeps § Types
lang: en                           # which language convention the values follow — agents/planner.md § Language
plan_id: string
objective: >                       # what is different for the user when this is done
tldr: |                            # 3-5 lines a reader can skim
research_confidence: 0.0-1.0
context_budget: 35k
non_goals: [string]                # what this plan deliberately does not do
assumptions: [string]
confirmed_values: []               # each value the user fixed, one home: {name, value, source: "user YYYY-MM-DD, verbatim" or file:line}
user_actions: []                   # what only the user can do, outside the agents: {what, when: before|during|after W<n>, why}
target_layout: null                # the file tree once the plan is done, as a literal block; null when no file is created, moved or deleted
requirements: [{id: R-1, text: string, source: "UC-042/AC-3 | user YYYY-MM-DD, verbatim | Qn"}]   # what the user asked for, one entry each; every task but closeout names ≥1 in covers_requirements; each is one box of the Done criteria section of plan.<lang>.md — agent-hub check plan trace
affected_surfaces: []              # copied from change_design.plan: one {id, surface, kind, task_ids, reason} per surface the change reaches; task_ids empty only with a reason; or the string 'N/A: reason' — agent-hub check plan surfaces
plan_metrics:
  waves: 0
  tasks: 0
  subtasks: 0
  est_diff_lines: 0

recommended_approach: >            # the chosen approach, one paragraph
approach_variants:                 # standard = 1, extended = 2-3, quick = omit
  - id: V1
    approach: string
    why_not_chosen: string|null

pre_mortem:                        # quick = omit, standard = top 3, extended = full
  - risk: string
    likelihood: low|medium|high
    impact: string
    mitigation: string
    rollback: string

contracts:                         # every contract needs a producer AND a consumer task
  - id: C1
    surface: "POST /api/orders"    # route · event · schema · socket · exported symbol
    producer_task: W1-T1
    consumer_tasks: [W2-T1]
    shape: string

deviations_from_analysis:          # where this plan departs from the brainstorm's analysis.
  - field: binding_scope.files_allowed   # which field of the analysis
    plan_does: ≤1 sentence on what the plan does instead
    evidence: file:line or the impact result that forced the departure
  # A silent departure is the defect; a recorded one is information. [] when there is none.

waves:
  - id: W1
    name: string
    is_prerequisite: false         # when true: refs/roles/planner/dag.md § Wave rules
    acceptance_criteria: [string]  # mirrored as - [ ] checkboxes in plan.<lang>.md
    wave_rationale: string|null    # required when wave order deviates from the layer order

tasks:                             # every task in full, the keys of task-template.yaml plus wave and depends_on
  - id: W1-T1                      # stable id, referenced by commits + reviews
    wave: W1
    depends_on: [W1-T0]            # task ids of this plan, or the single sentinel ALL (see CLOSEOUT below)
    title: string                  # one line, user-visible
    what: string                   # WHAT the work is, 2-4 sentences
    purpose: string                # WHY it exists
    out_of_scope: []               # what this task deliberately does not change
    files: [{path: string, change: edit, why: string}]   # change: create | edit | delete
    solution: string               # HOW, one paragraph
    before_after: [{aspect: string, before: string, after: string}]
    logic: []                      # numbered steps, required on a logic task
    approach: {chosen: string, why: string, cost: string}   # required on a logic task
    steps: [{n: 1, file: string, action: edit, anchor: string, before: string, after: string, expect: null, why: string, done: false}]
    interfaces: {consumes: [], produces: []}
    pattern_refs: []               # file:line — what to copy
    alternatives_rejected: []      # [{option, why_not}] or [{none_because}] on a logic task
    user_visible_rules: []         # [{rule, ac}], ac never empty
    risks: []
    agent: implement
    tier: L2
    status: pending
    blocker: null
    design_brief_ref: null
    covers_uc: null
    covers_requirements: [R-1]
    est_diff_lines: 0
    review_checkpoint: {required: true, estimate_min: 4, focus: [string], risk_areas: [string]}
    acceptance_criteria: ["AC-1: string"]
    test_cases: []                 # each case: id, scenario, steps, expected, layer, kind, covers_acceptance — task-template.yaml
    touches: [logic]
    layer_waivers: []
    case_kind_waivers: []
    screen_states: {}
    state_waivers: []
    verification: [string]
    subtasks: []
    result: null                   # filled when status reaches reviewing; shape in task-template.yaml

# ---------------------------------------------------------------------------
# CLOSEOUT — the final wave. Exactly one task, on every plan that produces a
# diff. Rules: CLAUDE.md §21. Do not rename it, do not merge it into another
# task: depends_on is what makes it run last.
#
# `depends_on: [ALL]` is a VALID value of depends_on, not a placeholder to fill
# in. ALL means EVERY OTHER TASK IN THIS PLAN — no id list is written out.
# Keep the sentinel; do not expand it into explicit ids. An explicit list goes
# stale the moment a task is inserted mid-plan, and closeout then runs EARLY,
# skipping the unfinished tasks and raising no error of any kind. User decision,
# 2026-09-04, after a plan gained two tasks after its waves were written.
# ---------------------------------------------------------------------------
  - id: WZ-CLOSEOUT                # the same keys as above; its CLOSEOUT note is in task-template.yaml
    wave: WZ                       # the last wave id in this plan
    depends_on: [ALL]              # every other task in this plan
    owner: implement               # in place of agent; test_cases: [] is valid here only


validation_strategy:
  per_wave: string
  final: string                    # each condition is one box of the Done criteria section of plan.<lang>.md, after one box per requirements[] entry; no other source
  ac_check_from: W1                # the first wave whose finished tasks carry result.ac_check (refs/closeout.md § What every meaningful change answers); absent means the plan predates the rule and agent-hub check plan chk_ac_results skips it
  change_record_standard: 1        # 1 marks a plan born under the change-record standard (refs/closeout.md § Data impact): every done task then carries result.run and result.data_impact; absent means the plan predates the rule and agent-hub check plan chk_data_impact skips it
  state_case_standard: 1           # 1 marks a plan born under the screen-state standard (refs/roles/planner/test-cases.md § Screen states): every screen task then carries screen_states and a case or waiver per state; absent means the plan predates the rule and agent-hub check plan chk_screen_states skips it
  commands: [string]               # exact commands, with what counts as pass
  review_deep_paths: [{path: string, section: string|null, reason: string}]   # copied from change_design: the final review explains these hunk by hunk and the packet lists them first
  checkpoints: [{after_wave: string, task_ids: [string], reason: string, expected_red: [{check: string, owner_task: string, reason: string}]}]   # a test spawn in mode=script runs after that wave; a red check passes only when expected_red names it and its owner_task sits in a later wave

rollback_strategy:
  trigger: string
  steps: [string]

context_budget_breakdown:
  planning: string
  per_wave: string
approval: null                     # stamped by agent-hub check plan --approve at the plan gate as {by: the user's words verbatim, at: ISO 8601 datetime with the local time zone, fingerprint: sha256, spec_fingerprint: sha256 over the UC and spec files covers_uc resolves to, null when no task names one}; a later edit to the plan fails chk_approval until it is approved again; agent-hub review-packet reads at as the approval time
