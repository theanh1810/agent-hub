# CLOSEOUT — tasks/WZ/WZ-CLOSEOUT.yaml, exactly one per plan that produces a
# diff (CLAUDE.md §21). The same keys as above, with three differences:
# owner: implement in place of agent — never normalise one into the other;
# test_cases: [], the only task where an empty list is valid; and its task
# entry in plan.yaml carries depends_on: [ALL] (plan-template.yaml). The
# defaults below are commented out on purpose: copy them in, then fill them; keys not listed below keep the shape above.
# ---------------------------------------------------------------------------
# id: WZ-CLOSEOUT
# title: Closeout — reindex, write results back, sync the spec, update mem0
# what: >
#   Run all five closeout steps: reindex GitNexus, compare the real diff
#   against the planned file list, check that every finished task's result
#   is in its task file — the mirror carries status and the Result block
#   rebuilt from it — sync the spec, update mem0, then clear the temp files,
#   finished worktrees and tool litter (agent-hub worktree-sweep).
# purpose: >
#   Working code is not the end of it. The GitNexus graph, the plan's result,
#   the spec, mem0 and the temp directory all go stale the moment the diff
#   lands. Nothing fails loudly — the next run reads them, believes them, and
#   is wrong.
# files:
#   - path: "{plan_dir}/tasks/"
#     change: edit
#     why: a result missing from a finished task's file is written now
#   - path: "{plan_dir}/plan.<lang>.md"
#     change: edit
#     why: the mirror — status, step ticks and the Result block rebuilt from the task files
# solution: >
#   Follow the order of CLAUDE.md §21: reindex first because the four steps
#   after it all cite symbols; mem0 last because it records what shipped, not
#   what was attempted.
# owner: implement
# status: pending                # as on every task — without it closeout never reaches done
# covers_uc: null                # closeout covers no UC — it is what syncs them
# acceptance_criteria:
#   - "mcp__gitnexus__detect_changes ran and gitnexus analyze exited 0, or reindex records n/a - ~/.claude is never indexed (skills/gitnexus-flow Rule 2)"
#   - "Every path in the diff is in the union of the task files' files[].path, or listed explicitly in closeout.unplanned_paths"
#   - "Every done task has a full result in its task file; the mirror carries status and the Result block rebuilt from it"
#   - "spec_required=true → every spec_delta written into its UC, ## History bumped, ### Test mapping filled"
#   - "mem0 gains at most 3 new entries, or [] with a reason"
#   - "git status --short shows no ?? created by this run"
# test_cases: []                 # closeout has no test case — it is a gate, not a behaviour
# verification:
#   - "git status --short"
#   - "mcp__gitnexus__detect_changes(scope='unstaged')"
# review_checkpoint:
#   required: true
#   focus: [closeout_incomplete, result_write_back, artifact_litter, spec_drift]
#   estimate_min: 4
#   risk_areas: ["plan_written_back claiming more than is true", "mem0 storing transient data"]
# result: null                   # fill this in when status reaches `done` — see CLAUDE.md §20
